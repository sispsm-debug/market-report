name: KPTU 노동·인권 브리핑

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install anthropic requests beautifulsoup4 lxml
      - run: python kptu_briefing.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KPTU_BOT_TOKEN: ${{ secrets.KPTU_BOT_TOKEN }}
          KPTU_CHAT_ID: ${{ secrets.KPTU_CHAT_ID }}
