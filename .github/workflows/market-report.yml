name: 증시 시황 보고서

on:
  schedule:
    # 평일(월~금) 오전 9:00 KST = UTC 00:00
    - cron: '0 0 * * 1-5'
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install anthropic requests beautifulsoup4 lxml

      - name: 증시 보고서 생성 및 카카오톡 전송
        run: python market_report.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_REST_APP_KEY: ${{ secrets.KAKAO_REST_APP_KEY }}
          # 네이버 검색 API (선택사항 - 없으면 웹 크롤링으로 fallback)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
